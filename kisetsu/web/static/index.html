<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisetsu</title>
  <link rel="preload" href="/static/fonts/inter-latin-opsz-wght.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Theme and accent are resolved before first paint. 'system' follows the OS.
    (function () {
      var mode = 'dark';
      try { mode = localStorage.getItem('kisetsu_theme') || 'dark'; } catch (err) {}
      var light = mode === 'light' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    })();
  </script>
  <script>
    // The data the first view shows is asked for now, while the scripts load; store.js takes these answers
    // instead of asking again. Each is used once, and only for a few seconds.
    (function () {
      var hash = location.hash.replace(/^#\/?/, '');
      var show = /^show\/(\d+)$/.exec(hash);
      var paths = ['/api/setup/status', '/api/status', '/api/settings'];
      var byView = { '': ['/api/shows', '/api/attention'], shows: ['/api/shows', '/api/attention'], calendar: ['/api/shows'],
        history: ['/api/history?limit=100'], feeds: ['/api/feeds'], settings: ['/api/tray', '/api/update'] };
      if (show) paths.push('/api/shows/' + show[1], '/api/shows/' + show[1] + '/feed-matches', '/api/feeds', '/api/shows');
      else paths = paths.concat(byView[hash] || []);
      var early = {};
      paths.forEach(function (path) {
        var answer = fetch(path);
        answer.catch(function () {});
        early[path] = { answer: answer, at: Date.now() };
      });
      window.__kisetsuEarly = early;
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css?v=@@v:css/tokens.css@@">
  <link rel="stylesheet" href="/static/css/base.css?v=@@v:css/base.css@@">
  <link rel="stylesheet" href="/static/css/components.css?v=@@v:css/components.css@@">
  <link rel="stylesheet" href="/static/css/layout.css?v=@@v:css/layout.css@@">
  <link rel="stylesheet" href="/static/css/views.css?v=@@v:css/views.css@@">
  <script>
    // After the stylesheets, so the cached accent overrides their colours.
    try {
      var css = localStorage.getItem('kisetsu_accent_css6');
      if (css) { var el = document.createElement('style'); el.id = 'user-accent'; el.textContent = css; document.head.appendChild(el); }
    } catch (err) {}
  </script>
</head>
<body>
  <div id="app" style="display:contents"></div>
  <noscript>Kisetsu needs JavaScript.</noscript>
  <script type="importmap">@@importmap@@</script>
  <script>
    // Every module is fetched at once, instead of one level of imports after another.
    try {
      var modules = JSON.parse(document.querySelector('script[type="importmap"]').textContent).imports;
      Object.keys(modules).forEach(function (name) {
        var link = document.createElement('link');
        link.rel = 'modulepreload';
        link.href = modules[name];
        document.head.appendChild(link);
      });
    } catch (err) {}
  </script>
  <script type="module" src="/static/js/main.js?v=@@v:js/main.js@@"></script>
</body>
</html>
