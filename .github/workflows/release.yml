name: Release

# Runs only when a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
    steps:
      - uses: actions/checkout@v4

      # The app compares its own version with the latest tag, so they must agree.
      - name: Check the tag matches the version
        shell: bash
        working-directory: rust
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "The tag $GITHUB_REF_NAME does not match version $version in rust/Cargo.toml." >&2; exit 1; }

      # The public key built into the app, which checks an update's signature before installing it.
      - name: Check the update key is set
        shell: bash
        env:
          KISETSU_UPDATE_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          printf '%s' "$KISETSU_UPDATE_KEY" | grep -Eqx 'RW[A-Za-z0-9+/=]{54}' || { echo "The MINISIGN_PUBLIC_KEY variable must be the key line of minisign.pub (RW...), alone." >&2; exit 1; }

      - name: Install the target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.target }}"

      - name: Build
        shell: bash
        working-directory: rust
        env:
          KISETSU_UPDATE_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: cargo build --release --locked --package kisetsu --target "${{ matrix.target }}"

      # The program is the whole app: the UI is built into it.
      - name: Name the program
        shell: bash
        run: cp "rust/target/${{ matrix.target }}/release/kisetsu${{ matrix.suffix }}" "kisetsu-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: kisetsu-v*
          if-no-files-found: error

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum kisetsu-* > SHA256SUMS

      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "The MINISIGN_SECRET_KEY secret is not set." >&2; exit 1; }
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          key="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m SHA256SUMS -x SHA256SUMS.minisig
          rm -f "$key"

      # The apps check updates with this public key, so it must belong to the secret key.
      - name: Verify the signature with the public key
        working-directory: dist
        env:
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: minisign -V -m SHA256SUMS -x SHA256SUMS.minisig -P "$MINISIGN_PUBLIC_KEY"

      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes kisetsu-* SHA256SUMS SHA256SUMS.minisig
