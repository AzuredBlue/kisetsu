[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
fancy-regex = { version = "0.20.2", default-features = false, features = ["std", "perf", "unicode"] }
jiff = "1.0.1"
sha1_smol = "1.0.1"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
