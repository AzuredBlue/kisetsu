[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
fancy-regex = { version = "0.20.2", default-features = false, features = ["std", "perf"] }
jiff = "1.0.1"
regex-syntax = { version = "0.8.12", default-features = false, features = ["std"] }
sha1_smol = "1.0.1"
