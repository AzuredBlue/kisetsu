[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
fancy-regex = { version = "0.20.2", default-features = false, features = ["std", "perf", "unicode"] }
jiff = "1.0.1"
sha1_smol = "1.0.1"
sha2 = { version = "0.11.1", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
quick-xml = "0.42.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
regex = "1.12.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
clap = { version = "4.6.9", default-features = false, features = ["std", "help", "usage", "error-context"] }
ctrlc = "3.5.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
notify-rust = { version = "4.19.0", default-features = false, features = ["z"] }
tauri-winrt-notification = "0.8.1"
